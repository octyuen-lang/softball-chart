<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cal Softball Batting Report</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.jpg">
<style>
:root{--bg:#F3F5F8;--p:#fff;--ink:#003262;--tx:#1B2533;--mut:#5B6778;--ln:#DDE2E9;--acc:#FDB515;--bad:#C42B2B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{display:flex;align-items:center;gap:12px;padding:8px 16px;background:#003262;color:#fff;border-bottom:3px solid var(--acc);flex-wrap:wrap}
header img{height:46px;width:46px;border-radius:8px}header b{font-size:18px;flex:1}header a{color:#fff;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px}header a:hover{background:rgba(255,255,255,.14)}
button,select,input{font:inherit;color:inherit;min-height:40px;border:1px solid var(--ln);border-radius:8px;background:var(--p);padding:0 12px}
button{cursor:pointer;font-weight:600}button.go{background:var(--acc);color:#003262;border-color:var(--acc)}
main{max-width:1250px;margin:auto;padding:14px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}label{font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:3px}
summary{cursor:pointer;font-weight:600;color:var(--ink);margin-bottom:8px}
#games{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px;max-height:260px;overflow:auto;margin:8px 0;border:1px solid var(--ln);border-radius:8px;padding:8px}
#games label{flex-direction:row;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--tx)}#games input{min-height:0;width:18px;height:18px}
#st{font-weight:600}#st.bad{color:var(--bad)}
#out{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:18px}
.brand{display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--acc);padding-bottom:8px;margin-bottom:10px}.brand img{height:56px;border-radius:8px}.brand h1{margin:0;font-size:22px;color:var(--ink)}.brand p{margin:0;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-bottom:6px}th,td{border:1px solid var(--ln);padding:5px 7px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{background:#003262;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}th.s:after{content:" ▼";font-size:9px}th.s.asc:after{content:" ▲"}
tr.t td{font-weight:700;background:#FFF6DC;border-top:2px solid #003262}tr{break-inside:avoid}
small,.mut{color:var(--mut)}.wrap{overflow-x:auto}
@media print{header,.noprint{display:none!important}body,main{background:#fff;padding:0}#out{border:0;padding:0}@page{margin:12mm;size:landscape}th{cursor:default}th.s:after{content:""}}
[hidden]{display:none!important}
header b{flex:1}.hnav{display:flex;flex-wrap:wrap;gap:2px}.hnav a{color:#fff;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px;font-size:14px}.hnav a:hover{background:rgba(255,255,255,.14)}.hnav a.on{box-shadow:inset 0 -3px 0 #FDB515}@media print{.hnav{display:none}}</style></head><body>
<header><a href="index.html"><img src="logo.jpg" alt="Cal Softball"></a><b>Batting Report</b><nav class="hnav"><a href="index.html">Home</a><a href="chart.html">Chart a game</a><a href="stats.html">Stats</a><a href="report.html">Pitching report</a><a href="batters.html" class="on">Batting report</a></nav><button class="noprint go" id="pr">Print / PDF</button><button class="noprint" id="cv">Download CSV</button></header>
<main>
<div class="card noprint">
<details id="conn"><summary>Data source</summary>
<div class="row"><label>Apps Script URL (ends in /exec)<input id="u" size="52" placeholder="https://script.google.com/macros/s/.../exec"></label><label>Token (only if you set one)<input id="t"></label><button class="go" id="ld" style="align-self:flex-end">Load from Sheet</button></div>
<div class="row"><label>Or upload the Pitches tab exported as CSV (Sheet: File, Download, CSV)<input type="file" id="fl" accept=".csv,text/csv"></label></div>
</details>
<div class="row"><span id="st" class="mut">Not loaded yet.</span></div>
<div class="row"><label>Team<select id="tm"></select></label><label>Facing<select id="fa"><option value="all">All pitchers</option><option value="R">Right-handed pitchers</option><option value="L">Left-handed pitchers</option></select></label><label>Batter bats<select id="fh"><option value="all">All</option><option value="R">Right</option><option value="L">Left</option></select></label></div>
<div><b>Games</b> <small>(tick the ones to include)</small><br><button id="a1">All</button> <button id="a3">Last 3</button> <button id="a0">None</button></div><div id="games"></div>
</div>
<div id="out"><p class="mut">Load your data, then pick the games to include.</p></div>
</main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const q=new URLSearchParams(location.search);let cfg={};try{cfg=JSON.parse(ls.get('sbcfg')||'{}')}catch(e){}
if(q.get('s'))cfg.url=q.get('s');if(q.get('t'))cfg.token=q.get('t');
const SW=['Swinging Strike','Foul','In Play'];
const cal=t=>/\b(cal|california|berkeley)\b/i.test(t||'');
let R=[],sel=new Set(),sortK='pa',sortAsc=false,lastRows=[];
const fmtDate=v=>{v=String(v||'');const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v);if(m)return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');if(/^\d{4}-\d\d-\d\dT.*Z$/.test(v)){const d=new Date(v);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}return v.slice(0,10)};
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'—',r3=v=>v.toFixed(3).replace(/^0/,''),d3=(a,b)=>b?r3(a/b):'—';
const norm=(h,rows)=>rows.map(r=>{const o={};h.forEach((k,i)=>o[k]=r[i]);return{game:String(o.GameID),date:fmtDate(o.Date),home:o.Home,away:o.Away,pa:+o.PA,n:+o['Pitch#'],bat:o.Batter,bt:o['Batting Team'],num:o['Batter #'],side:o.Bats=='Slapper'||o.Bats=='S'?'L':o.Bats,arm:o.Throws||'',res:o['Pitch Result'],par:o['PA Result']||''}}).filter(p=>p.game&&p.game!='undefined'&&p.bat);
function parseCSV(t){const rows=[];let r=[],c='',i=0,qt=false;t=t.replace(/^﻿/,'');for(;i<t.length;i++){const ch=t[i];if(qt){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else qt=false}else c+=ch}else if(ch=='"')qt=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c!==''||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>y!==''))}
function line(L){const pa=L.filter(p=>p.par),c=k=>pa.filter(p=>p.par==k).length,sw=L.filter(p=>SW.includes(p.res)).length,wh=L.filter(p=>p.res=='Swinging Strike').length;
const h1=c('Single'),h2=c('Double'),h3=c('Triple'),hr=c('Home Run'),bb=c('BB'),hb=c('HBP'),k=c('K'),PA=pa.length,AB=PA-bb-hb,H=h1+h2+h3+hr,TB=h1+2*h2+3*h3+4*hr;
const obp=PA?(H+bb+hb)/PA:null,slg=AB?TB/AB:null;
return{g:new Set(L.map(p=>p.game)).size,pa:PA,ab:AB,h:H,h1,h2,h3,hr,tb:TB,bb,hb,k,ba:AB?H/AB:null,obp,slg,ops:obp!=null&&slg!=null?obp+slg:null,kp:PA?k/PA:null,bp:PA?bb/PA:null,pit:L.length,ppa:PA?L.length/PA:null,swp:L.length?sw/L.length:null,whp:sw?wh/sw:null}}
const f3=v=>v==null?'—':r3(v),fp=v=>v==null?'—':Math.round(v*100)+'%';
const COLS=[['g','G',v=>v],['pa','PA',v=>v],['ab','AB',v=>v],['h','H',v=>v],['h1','1B',v=>v],['h2','2B',v=>v],['h3','3B',v=>v],['hr','HR',v=>v],['tb','TB',v=>v],['bb','BB',v=>v],['hb','HBP',v=>v],['k','K',v=>v],['ba','BA',f3],['obp','OBP',f3],['slg','SLG',f3],['ops','OPS',v=>v==null?'—':v.toFixed(3).replace(/^0/,'')],['kp','K %',fp],['bp','BB %',fp],['pit','Pitches',v=>v],['ppa','P/PA',v=>v==null?'—':v.toFixed(1)],['swp','Swing %',fp],['whp','Whiff %',fp]];
const setSt=(t,bad)=>{$('#st').textContent=t;$('#st').className=bad?'bad':'mut'};
const games=team=>{const m=new Map();R.filter(p=>p.bt==team).forEach(p=>{if(!m.has(p.game))m.set(p.game,{game:p.game,date:p.date,opp:p.bt==p.home?p.away:p.home,n:0});m.get(p.game).n++});return[...m.values()].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0)};
function build(){const team=$('#tm').value,fa=$('#fa').value,fh=$('#fh').value;if(!R.length||!team)return;
const gs=games(team).filter(g=>sel.has(g.game));if(!gs.length){$('#out').innerHTML='<p class="mut">Select at least one game.</p>';return}
const L=R.filter(p=>p.bt==team&&sel.has(p.game)&&(fa=='all'||p.arm==fa)&&(fh=='all'||p.side==fh));if(!L.length){$('#out').innerHTML='<p class="mut">No pitches match those filters.</p>';return}
const names=[...new Set(L.map(p=>p.bat))];
let rows=names.map(n=>{const l=L.filter(p=>p.bat==n),nm=l.find(p=>p.num);return{name:n,num:nm?nm.num:'',side:l[l.length-1].side,...line(l)}});
const T=line(L);
rows.sort((a,b)=>{const x=sortK=='name'?a.name:a[sortK],y=sortK=='name'?b.name:b[sortK];if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;const c=x<y?-1:x>y?1:0;return(sortAsc?c:-c)||(b.pa-a.pa)});
lastRows=rows.map(r=>[r.name,r.num,r.side,...COLS.map(c=>c[2](r[c[0]]))]).concat([['Team total','','',...COLS.map(c=>c[2](T[c[0]]))]]);
const dates=gs.map(g=>g.date).sort(),ng=gs.length;
const filt=[fa!='all'?'vs '+fa+'HP':'',fh!='all'?'bats '+fh:''].filter(Boolean).join(' · ');
const cell=(r,c)=>`<td>${c[2](r[c[0]])}</td>`;
$('#out').innerHTML=`<div class="brand"><img src="logo.jpg" alt="" onerror="this.remove()"><div><h1>${E(team)} Batting Report</h1><p>${ng} game${ng>1?'s':''}: ${E(dates[0])}${dates[0]!=dates[dates.length-1]?' to '+E(dates[dates.length-1]):''}${filt?' · '+E(filt):''}</p></div></div>
<div class="wrap"><table><tr><th data-k="name" class="${sortK=='name'?'s'+(sortAsc?' asc':''):''}">Batter</th><th>#</th><th>Bats</th>${COLS.map(c=>`<th data-k="${c[0]}" class="${sortK==c[0]?'s'+(sortAsc?' asc':''):''}">${c[1]}</th>`).join('')}</tr>
${rows.map(r=>`<tr><td>${E(r.name)}</td><td>${E(r.num)}</td><td>${E(r.side)}</td>${COLS.map(c=>cell(r,c)).join('')}</tr>`).join('')}
<tr class="t"><td>Team total</td><td></td><td></td>${COLS.map(c=>cell(T,c)).join('')}</tr></table></div>
<p><small>Tap a column heading to sort. BA = H ÷ AB. OBP = (H + BB + HBP) ÷ PA. SLG = total bases ÷ AB. AB excludes walks and hit-by-pitch; errors count as at-bats without a hit. Swing % = swings ÷ pitches seen; Whiff % = swinging strikes ÷ swings. Only plate appearances that were charted are counted. Runs, RBI and stolen bases are not tracked. Generated ${new Date().toLocaleDateString()}.</small></p>`}
function listGames(){const gs=games($('#tm').value);$('#games').innerHTML=gs.map(g=>`<label><input type="checkbox" data-g="${E(g.game)}" ${sel.has(g.game)?'checked':''}>${E(g.date)} · vs ${E(g.opp)}</label>`).join('')||'<span class="mut">No games for this team.</span>'}
function setTeam(){sel=new Set(games($('#tm').value).map(g=>g.game));listGames();build()}
function afterLoad(src){const teams=[...new Set(R.map(p=>p.bt))].sort((a,b)=>cal(b)-cal(a));if(!teams.length){setSt('Connected, but there are no pitches yet. Chart a game and tap "Send game to Sheet now" in the charting app.',1);return}
$('#tm').innerHTML=teams.map(t=>`<option>${E(t)}</option>`).join('');setTeam();setSt(`Loaded ${new Set(R.map(p=>p.game)).size} games, ${R.length} pitches (${src}) · ${new Date().toLocaleTimeString()}`)}
async function load(){let url=($('#u').value||cfg.url||'').trim(),tok=($('#t').value||cfg.token||'').trim();
if(!url){$('#conn').open=true;setSt('Paste your Apps Script URL first, or upload a CSV.',1);return}
if(!/\/exec(\?|$)/.test(url)){$('#conn').open=true;setSt('That URL should end in /exec (Deploy > Manage deployments > Web app URL).',1);return}
cfg={url,token:tok};let old={};try{old=JSON.parse(ls.get('sbcfg')||'{}')}catch(e){}ls.set('sbcfg',JSON.stringify({...old,url,token:tok}));
setSt('Loading…');let txt;
try{const r=await fetch(url+(url.includes('?')?'&':'?')+'action=all'+(tok?'&token='+encodeURIComponent(tok):''));txt=await r.text();if(!r.ok)throw new Error('HTTP '+r.status)}
catch(e){$('#conn').open=true;setSt('Could not reach the script ('+(e.message||'network error')+'). Check the URL and that access is "Anyone", or upload a CSV below.',1);return}
let d;try{d=JSON.parse(txt)}catch(e){$('#conn').open=true;setSt(/<html|<!DOCTYPE/i.test(txt)?'Google returned a page instead of data. Set "Who has access" to Anyone and redeploy.':'The script is the old version without report support. Update it, or upload the Pitches tab as a CSV below.',1);return}
if(d.error){$('#conn').open=true;setSt(d.error=='bad token'?'Token does not match the one in the script.':'Script error: '+d.error,1);return}
if(!d.header||!d.header.length){setSt('Connected, but the Pitches tab is empty.',1);return}
R=norm(d.header,d.rows||[]);afterLoad('Sheet')}
$('#ld').onclick=load;
$('#fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const a=parseCSV(String(rd.result));if(a.length<2||!a[0].includes('GameID'))throw 0;R=norm(a[0],a.slice(1));afterLoad('CSV file')}catch(x){setSt('That file does not look like the Pitches tab. It needs the header row starting with GameID.',1)}};rd.readAsText(f)};
$('#tm').onchange=setTeam;$('#fa').onchange=$('#fh').onchange=build;
$('#games').onchange=e=>{const g=e.target.dataset.g;e.target.checked?sel.add(g):sel.delete(g);build()};
const pick=f=>{sel=new Set(games($('#tm').value).filter(f).map(g=>g.game));listGames();build()};
$('#a1').onclick=()=>pick(()=>true);$('#a0').onclick=()=>pick(()=>false);
$('#a3').onclick=()=>{const g=games($('#tm').value).slice(0,3).map(x=>x.game);pick(x=>g.includes(x.game))};
$('#out').onclick=e=>{const th=e.target.closest('th[data-k]');if(!th)return;const k=th.dataset.k;if(sortK==k)sortAsc=!sortAsc;else{sortK=k;sortAsc=k=='name'}build()};
$('#pr').onclick=()=>window.print();
$('#cv').onclick=()=>{if(!lastRows.length)return;const h=['Batter','#','Bats',...COLS.map(c=>c[1])],t=[h,...lastRows].map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='batting-report.csv';document.body.appendChild(a);a.click();a.remove()};
$('#u').value=cfg.url||'';$('#t').value=cfg.token||'';
if(cfg.url)load();else{$('#conn').open=true}
</script></body></html>
