<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cal Softball Pitch Chart</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F7;--panel:#fff;--ink:#003262;--mut:#42597A;--line:#B7C3D3;--acc:#FDB515;--accInk:#003262;--bad:#C42B2B;--grass:#3E9B55;--dirt:#C99A6B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#06162B;--panel:#0C2445;--ink:#F1F5FA;--mut:#A9BBD3;--line:#24406B;--bad:#FF7070}}
:root[data-theme="dark"]{--bg:#06162B;--panel:#0C2445;--ink:#F1F5FA;--mut:#A9BBD3;--line:#24406B;--bad:#FF7070}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
h3{margin:.2em 0 .4em}small{color:var(--mut)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:#003262;color:#fff;border-bottom:4px solid #FDB515;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{display:flex;align-items:center;gap:10px;font:700 26px "Barlow Condensed",Impact,sans-serif;letter-spacing:1px;margin-right:auto;color:#FDB515}header b small{color:#fff;opacity:.85;font-size:16px}#logo{height:40px;width:auto}
header button{min-height:44px;padding:0 14px;border-radius:8px;border:2px solid rgba(255,255,255,.7);background:transparent;color:#fff;font-weight:700;cursor:pointer}
header button.on{background:#FDB515;color:#003262;border-color:#FDB515}
button,select,input{font:inherit;color:inherit}
.b{min-height:56px;border:2px solid var(--line);background:var(--panel);border-radius:10px;font-weight:700;cursor:pointer;padding:4px 8px}
.b.on{background:var(--acc);color:var(--accInk);border-color:var(--ink)}
.b:active{transform:scale(.97)}
.b.go{background:var(--ink);color:var(--bg)}
input,select{min-height:44px;border:2px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px;width:100%}
main{padding:12px;max-width:1500px;margin:auto}
.card{background:var(--panel);border:2px solid var(--line);border-top:5px solid var(--acc);border-radius:12px;padding:12px}
#live{display:grid;gap:12px;grid-template-columns:minmax(220px,260px) minmax(500px,1.8fr) minmax(260px,330px);align-items:start}
.pe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,280px);gap:12px;align-items:start;margin-top:8px}.pe #zwrap{margin:0;max-width:280px}#pe #types .b,#pe #outs .b{min-height:46px}
@media(max-width:1000px){#live{grid-template-columns:1fr 1fr}.c3{grid-column:1/-1}#live>section:nth-child(2){grid-column:1/-1;order:-1}}
@media(max-width:640px){#live{grid-template-columns:1fr}.pe{grid-template-columns:1fr}.pe #zwrap{margin:8px auto}}
.tm{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:2px solid transparent}
.tm.at{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,transparent)}
.tm span:first-child{flex:1;font-weight:700}.tm b{font:700 34px "Barlow Condensed",sans-serif}
.adj button{width:36px;height:36px;border-radius:8px;border:2px solid var(--line);background:var(--panel);font-weight:700}
.inn{font:700 22px "Barlow Condensed",sans-serif;margin:8px 0}
.cnt{display:flex;gap:16px;align-items:end}.cnt b{display:block;font:700 46px/1 "Barlow Condensed",sans-serif}
.oc{display:flex;align-items:center;gap:6px}.oc button{width:38px;height:38px;border-radius:8px;border:2px solid var(--line);background:var(--panel);font-size:20px;font-weight:700;cursor:pointer}.oc b{min-width:26px;text-align:center}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid var(--ink);background:transparent;margin-right:6px}.dot.on{background:var(--bad);border-color:var(--bad)}
.base{fill:var(--panel);stroke:var(--ink);stroke-width:3;cursor:pointer}.base.on{fill:var(--acc)}
.grid{display:grid;gap:8px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:640px){.g4{grid-template-columns:repeat(2,1fr)}}
#zwrap{position:relative;max-width:320px;margin:8px auto}#zone{width:100%;display:block;touch-action:manipulation;cursor:crosshair}#qp{position:absolute;z-index:3;width:210px;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px;background:var(--panel);border:3px solid var(--ink);border-radius:12px;box-shadow:0 6px 20px #0006}#qp .b{min-height:48px;font-size:15px}
.zin{fill:color-mix(in srgb,var(--acc) 30%,var(--panel));stroke:var(--ink);stroke-width:2}.zout{fill:var(--panel);stroke:var(--line);stroke-width:1}
.vg{grid-template-columns:repeat(7,1fr)}.vg .b{min-height:44px;font-size:16px;padding:0}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs .b{flex:1;min-height:44px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}.bar i{display:block;height:14px;background:var(--acc);border:1px solid var(--ink);border-radius:4px}
.bar span:first-child{width:78px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:3px 6px;text-align:left}th{background:color-mix(in srgb,var(--line) 40%,transparent)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 6px;margin:2px;font-size:13px}
.row{display:grid;grid-template-columns:24px 1fr 64px 92px;gap:6px;margin-bottom:6px;align-items:center}.row.p{grid-template-columns:1fr 92px}
.split{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:760px){.split{grid-template-columns:1fr}}
.fld{grid-template-columns:1fr 1fr;display:grid;gap:8px}
dialog{border:0;border-radius:14px;width:min(940px,96vw);max-height:92vh;padding:16px;background:var(--panel);color:var(--ink)}dialog::backdrop{background:#000a}
#field,.fs{width:100%;max-width:420px;display:block;cursor:crosshair}
.sprow{display:grid;grid-template-columns:minmax(260px,1fr) 1fr;gap:14px}@media(max-width:700px){.sprow{grid-template-columns:1fr}}
#msg{color:var(--bad);font-weight:700;min-height:1.4em}
#book{background:#fff;color:#000;padding:16px;--panel:#fff;--ink:#000;--line:#888;--mut:#333}
#book{-webkit-print-color-adjust:exact;print-color-adjust:exact}#book h2,#book h3{color:#003262}#book h2{margin:0}#book th{background:#003262;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}#book .brand{display:flex;align-items:center;gap:10px;border-bottom:4px solid #FDB515;padding-bottom:6px;margin-bottom:8px;font:700 20px "Barlow Condensed",Impact,sans-serif;letter-spacing:1px;color:#003262}#book table{margin:6px 0 14px;page-break-inside:auto}#book tr{break-inside:avoid}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
[hidden]{display:none!important}
@media print{header,#setup,#live,dialog,.noprint{display:none!important}body{background:#fff}#book{display:block!important;padding:0}@page{margin:12mm}.brk{break-before:page}}
</style></head><body>
<header><b><svg id="lb" width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#FDB515" stroke="#fff" stroke-width="2"/><path d="M9 9C15 16 15 24 9 31M31 9C25 16 25 24 31 31" fill="none" stroke="#003262" stroke-width="2"/><text x="20" y="25" font-size="13" font-weight="700" text-anchor="middle" fill="#003262" font-family="Barlow Condensed,Impact,sans-serif">CAL</text></svg><img id="logo" src="logo.png" alt="Cal Softball" hidden onload="this.hidden=false;document.getElementById('lb').hidden=true"><span>CAL SOFTBALL <small>PITCH CHART</small></span></b>
<button data-a="undo" id="undo">Undo</button><button data-a="dlg">Roster</button>
<button data-a="view" data-v="live" id="nl">Live</button><button data-a="view" data-v="book" id="nb">Scorebook</button><button data-a="view" data-v="setup" id="ns">Setup</button>
<button data-a="new" id="newb">New game</button><span id="sbadge" style="font-size:12px"></span><button data-a="dd">Data</button><button data-a="theme">Theme</button></header>

<main id="setup"><div class="card"><h3>Game info</h3>
<div class="grid g4">
<label>Home team<input id="gh" data-k="g.home"></label><label>Away team<input data-k="g.away" id="ga"></label>
<label>Date / time<input type="datetime-local" data-k="g.date" id="gd"></label><label>Venue<input data-k="g.venue" id="gv"></label>
<label>Innings<input type="number" min="1" max="12" data-n="1" data-k="g.inn" id="gi"></label></div>
<div class="split" id="srost" style="margin-top:14px"></div>
<p><button class="b go" data-a="start" style="width:100%;font-size:20px">Start game</button></p></div></main>

<main id="live" hidden>
<section class="card" id="sb"></section>
<section class="card" id="pe"><div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1;margin:0">Pitch entry</h3><button class="b" data-a="quick" id="qb" style="min-height:40px;font-size:14px"></button></div>
<div class="pe"><div><div class="grid g2" id="types"></div><div style="margin-top:8px"><b>Velocity (mph)</b> <small>tap again to clear</small><div class="grid vg" id="vel" style="margin-top:4px"></div></div></div>
<div id="zwrap"><svg id="zone" viewBox="0 0 300 330"></svg><div id="qp" hidden></div></div></div>
<div class="grid g4" id="outs" style="margin-top:8px"></div></section>
<section class="card c3"><div class="tabs"><button class="b" data-a="tab" data-v="p">Pitcher</button><button class="b" data-a="tab" data-v="a">At-bat</button></div><div id="tb"></div></section>
</main>

<main id="book" hidden></main>

<dialog id="dd"><div style="display:flex"><h3 style="flex:1">Save &amp; sync data</h3><button class="b" data-a="dd" data-v="x">Done</button></div>
<h4>Files</h4><div class="grid g2"><button class="b" data-a="xjson">Export game (.json)</button><button class="b" data-a="xcsv">Export pitches (.csv)</button><button class="b" data-a="imp" style="grid-column:span 2">Import game (.json)</button></div><input type="file" id="imf" accept=".json,application/json" hidden>
<h4>Google Sheets</h4><label>Apps Script web app URL<input id="cu" data-c="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
<label>Secret token (optional, must match the script)<input id="ct" data-c="token"></label>
<label>Auto-send<select id="cm" data-c="mode"><option value="pitch">After every pitch</option><option value="half">After every half-inning</option><option value="manual">Manual only</option></select></label>
<p><button class="b go" data-a="sendnow" style="width:100%">Send game to Sheet now</button></p><p id="sst"></p></dialog>
<dialog id="rd"><div style="display:flex"><h3 style="flex:1">Roster &amp; substitutions</h3><button class="b" data-a="dlg" data-v="x">Done</button></div><div class="split" id="rrost"></div></dialog>
<dialog id="spray"><h3>Ball in play</h3><div class="sprow"><svg id="field" viewBox="0 0 400 400"></svg>
<div><b>1. Tap where it landed</b><br><b>2. Hit type</b><div class="grid g2" id="hts" style="margin:6px 0 10px"></div><b>3. Result</b><div class="grid g2" id="rss" style="margin:6px 0"></div><div id="msg"></div><button class="b" data-a="cancelsp" style="width:100%">Cancel (undo this pitch)</button></div></div></dialog>

<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const T=['Rise','Drop','Curve','Screw','Changeup','Offspeed','Fastball','Unknown'];
const O={ball:'Ball',cs:'Called Strike',ss:'Swinging Strike',foul:'Foul',inplay:'In Play',hbp:'HBP',pitchout:'Pitchout',illegal:'Illegal Pitch'};
const STR=['cs','ss','foul','inplay'],HT=['Ground Ball','Fly Ball','Line Drive','Pop-up','Bunt'];
const RS={single:'Single',double:'Double',triple:'Triple',hr:'Home Run',fc:"Fielder's Choice",out:'Out',err:'Error'};
const CNTS=['0-0','0-1','0-2','1-0','1-1','1-2','2-0','2-1','2-2','3-0','3-1','3-2'];
const rows=n=>Array.from({length:n},()=>({name:'',num:'',side:'R'}));
const newId=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36);
const blank=()=>({id:newId(),g:{home:'Home',away:'Away',date:new Date().toISOString().slice(0,16),venue:'',inn:7},L:{away:rows(9),home:rows(9)},P:{away:[{name:'',arm:'R'}],home:[{name:'',arm:'R'}]},cp:{away:0,home:0},bi:{away:0,home:0},inn:1,half:'top',outs:0,b:0,s:0,bases:[0,0,0],score:{away:0,home:0},pa:1,pitches:[],plays:[]});
let S=blank(),H=[],sel={type:'Fastball',x:null,y:null},tab='p',view='setup',pend=null,sp={},anK=null,newT=0,bookP='all';
try{const d=JSON.parse(ls.get('sbk')||'null');if(d){S=d.S;view=d.view}}catch(e){}S.id=S.id||newId();sel.quick=!!ls.get('sbq');
const save=()=>ls.set('sbk',JSON.stringify({S,view}));
const bt=()=>S.half=='top'?'away':'home',ft=()=>S.half=='top'?'home':'away',tn=t=>S.g[t]||t;
const snap=()=>{H.push(JSON.stringify(S));if(H.length>300)H.shift()};
const bp=(t,i)=>S.L[t][i%S.L[t].length],who=(t,i)=>{const r=bp(t,i);return r.name||(r.num?'#'+r.num:'Batter '+(i%S.L[t].length+1))};
const pn=k=>{const[t,i]=k.split(':'),p=S.P[t][i];return p?(p.name||'Pitcher '+(+i+1)):'?'};
const pk=k=>{const[t,i]=k.split(':');return tn(t)+' – '+pn(k)};
function zl(x,y){if(x==null)return'—';const c=Math.min(4,x/60|0),r=y<60?0:y>=270?4:1+Math.floor((y-60)/70);if(r>0&&r<4&&c>0&&c<4)return String((r-1)*3+c);return[r==0?'Hi':r==4?'Lo':'',c==0?'L':c==4?'R':''].filter(Boolean).join('-')}
const run=()=>S.score[bt()]++;
function adv(n,b){const nb=[0,0,0];for(let i=2;i>=0;i--)if(S.bases[i]){const t=i+n;t>=3?run():nb[t]=1}if(b){n>=4?run():nb[n-1]=1}S.bases=nb}
function walk(){const b=S.bases;if(b[0]){if(b[1]){if(b[2])run();b[2]=1}b[1]=1}b[0]=1}
function chk(){if(S.outs>=3){S.outs=0;S.bases=[0,0,0];S.b=S.s=0;flip=1;if(S.half=='top')S.half='bottom';else{S.half='top';S.inn++}}}
let flip=0;const done=()=>{save();render();auto()};
function endPA(res,fn,ex){fn&&fn();const t=bt(),f=ft();S.plays.push({pa:S.pa,inn:S.inn,half:S.half,t,bi:S.bi[t],pk:f+':'+S.cp[f],res,...ex});S.pa++;S.b=S.s=0;S.bi[t]++;chk();done()}
function pitch(o){snap();const t=bt(),f=ft(),p={pa:S.pa,n:S.pitches.filter(q=>q.pa==S.pa).length+1,inn:S.inn,half:S.half,t,bi:S.bi[t],pk:f+':'+S.cp[f],type:sel.type,velo:sel.velo||'',x:sel.x,y:sel.y,o,cnt:S.b+'-'+S.s};
S.pitches.push(p);sel.x=sel.y=null;if(!sel.quick)sel.velo='';drawVel();drawDot();
if(o=='ball'||o=='pitchout'){if(++S.b>=4)return endPA('BB',walk)}
else if(o=='illegal'){if(++S.b>=4)return endPA('BB',walk);adv(1,0)}
else if(o=='cs'||o=='ss'){if(++S.s>=3)return endPA('K',()=>S.outs++)}
else if(o=='foul'){if(S.s<2)S.s++}
else if(o=='hbp')return endPA('HBP',walk);
else if(o=='inplay'){pend=p;return openSpray()}
done()}
const APPLY={single:()=>adv(1,1),double:()=>adv(2,1),triple:()=>adv(3,1),hr:()=>adv(4,1),err:()=>adv(1,1),out:()=>S.outs++,fc:()=>{for(let i=2;i>=0;i--)if(S.bases[i]){S.bases[i]=0;S.outs++;break}S.bases[0]=1}};
/* field + zone svg */
const FIELD='<path d="M200 370 L23 193 A250 250 0 0 1 377 193 Z" fill="var(--grass)"/><polygon points="200,370 250,320 200,270 150,320" fill="var(--dirt)" stroke="#fff" stroke-width="2"/><path d="M200 370 L23 193 M200 370 L377 193" stroke="#fff" stroke-width="3"/><path d="M23 193 A250 250 0 0 1 377 193" fill="none" stroke="#fff" stroke-width="4"/><circle cx="200" cy="320" r="7" fill="#fff"/>';
const DC=r=>({single:'#FACC15',double:'#FACC15',triple:'#FACC15',hr:'#FACC15',out:'#E5E7EB',err:'#EF4444',fc:'#F97316'}[r]||'#fff');
const RL={single:'1B',double:'2B',triple:'3B',hr:'HR',out:'O',err:'E',fc:'FC'};
function fieldSvg(pl,cls){return`<svg class="fs" viewBox="0 0 400 400" ${cls||''}>${FIELD}${pl.filter(p=>p.x!=null).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="10" fill="${DC(p.r)}" stroke="#000" stroke-width="1.5"/><text x="${p.x}" y="${p.y+4}" font-size="10" font-weight="700" text-anchor="middle" fill="#000">${RL[p.r]||''}</text>`).join('')}</svg>`}
const PC=o=>o=='ball'||o=='pitchout'||o=='illegal'||o=='hbp'?'#3B82F6':o=='inplay'?'#16A34A':'#DC2626';
const RY=[0,60,130,200,270],RH=[60,70,70,70,60];
const zGrid=()=>Array.from({length:25},(_,k)=>{const c=k%5,r=k/5|0,i=r>0&&r<4&&c>0&&c<4;return`<rect x="${c*60}" y="${RY[r]}" width="60" height="${RH[r]}" class="${i?'zin':'zout'}"/>`}).join('')+'<rect x="60" y="60" width="180" height="210" fill="none" stroke="var(--ink)" stroke-width="4"/>';
const zoneSvg=l=>`<svg class="fs" viewBox="0 0 300 330" style="max-width:280px">${zGrid()}${l.filter(p=>p.x!=null).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="7" fill="${PC(p.o)}" stroke="#fff" stroke-width="1.5"/>`).join('')}</svg>`;
const TC={Rise:'#2563EB',Drop:'#DC2626',Curve:'#16A34A',Screw:'#9333EA',Changeup:'#F59E0B',Offspeed:'#0891B2',Fastball:'#111827',Unknown:'#6B7280'};
const zoneT=l=>`<svg class="fs" viewBox="0 0 300 330" style="max-width:300px">${zGrid()}${l.filter(p=>p.x!=null).map(p=>`<circle cx="${p.x}" cy="${p.y}" r="9" fill="${TC[p.type]}" stroke="#fff" stroke-width="1.5"/><text x="${p.x}" y="${p.y+3}" font-size="8" font-weight="700" text-anchor="middle" fill="#fff">${p.type.slice(0,2)}</text>`).join('')}</svg>`;
const sw=c=>`<i style="width:12px;height:12px;border-radius:50%;background:${c};display:inline-block;margin-right:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact"></i>`;
const legend=a=>`<div style="font-size:13px">${a.map(([c,t])=>`<span style="margin-right:10px;white-space:nowrap">${sw(c)}${t}</span>`).join('')}</div>`;
function drawDot(){$('#zdot')&&$('#zdot').remove();if(sel.x==null)$('#qp').hidden=true;if(sel.x!=null)$('#zone').insertAdjacentHTML('beforeend',`<circle id="zdot" cx="${sel.x}" cy="${sel.y}" r="10" fill="var(--bad)" stroke="#fff" stroke-width="3"/>`)}
/* roster editor */
const opt=(a,v)=>a.map(([x,l])=>`<option value="${x}" ${x==v?'selected':''}>${l}</option>`).join('');
const rost=t=>`<div><h3>${E(tn(t))}</h3><b>Lineup</b><small> (name, jersey #, bats)</small>`+S.L[t].map((r,i)=>`<div class="row"><b>${i+1}</b><input data-k="L.${t}.${i}.name" placeholder="Player" value="${E(r.name)}"><input data-k="L.${t}.${i}.num" placeholder="#" inputmode="numeric" value="${E(r.num)}"><select data-k="L.${t}.${i}.side">${opt([['R','R'],['L','L'],['S','Slapper']],r.side)}</select></div>`).join('')+`<button class="b" data-a="add" data-v="L.${t}" style="width:100%;min-height:44px">+ Add batter</button><p><b>Pitchers</b><small> (first is the starter)</small></p>`+S.P[t].map((r,i)=>`<div class="row p"><input data-k="P.${t}.${i}.name" placeholder="Pitcher ${i+1}" value="${E(r.name)}"><select data-k="P.${t}.${i}.arm">${opt([['R','Right'],['L','Left']],r.arm)}</select></div>`).join('')+`<button class="b" data-a="add" data-v="P.${t}" style="width:100%;min-height:44px">+ Add pitcher</button></div>`;
const rosters=()=>rost('away')+rost('home');
/* stats */
const avg=a=>{const x=a.map(p=>+p.velo).filter(Boolean);return x.length?(x.reduce((a,b)=>a+b)/x.length).toFixed(1):'—'};
const pc=(a,b)=>b?Math.round(a/b*100)+'%':'—';
function stats(l){const f=l.filter(p=>p.n==1),s=p=>STR.includes(p.o);return{n:l.length,sp:pc(l.filter(s).length,l.length),fps:pc(f.filter(s).length,f.length),v:avg(l)}}
function mix(l){return T.map(t=>[t,l.filter(p=>p.type==t)]).filter(x=>x[1].length)}
/* render */
function renderSB(){const t=bt(),f=ft(),r=bp(t,S.bi[t]),pit=S.P[f][S.cp[f]];
$('#sb').innerHTML=['away','home'].map(x=>`<div class="tm ${t==x?'at':''}"><span>${E(tn(x))}</span><b>${S.score[x]}</b><span class="adj"><button data-a="sc" data-v="${x}-">−</button><button data-a="sc" data-v="${x}+">+</button></span></div>`).join('')+
`<div class="inn">${S.half=='top'?'▲ Top':'▼ Bottom'} ${S.inn} of ${S.g.inn}${S.inn>S.g.inn?' (extra innings)':''}</div>
<div class="cnt"><div><small>Balls</small><b>${S.b}</b></div><div><small>Strikes</small><b>${S.s}</b></div><div><small>Outs</small><span class="oc"><button data-a="oa" data-v="-1" aria-label="Remove an out">−</button><b>${S.outs}</b><button data-a="oa" data-v="1" aria-label="Add an out">+</button></span></div></div>
<svg viewBox="0 0 140 125" style="width:100%;max-width:160px;display:block;margin:4px auto"><path d="M70 105 L110 65 L70 25 L30 65Z" fill="none" stroke="var(--line)" stroke-width="2"/>${[[110,65],[70,25],[30,65]].map(([x,y],i)=>`<rect class="base ${S.bases[i]?'on':''}" x="${x-14}" y="${y-14}" width="28" height="28" transform="rotate(45 ${x} ${y})" data-a="base" data-v="${i}"/>`).join('')}<polygon points="70,97 78,105 74,113 66,113 62,105" fill="#fff" stroke="var(--ink)" stroke-width="2"/></svg>
<p><small>At bat (${E(tn(t))} #${S.bi[t]%S.L[t].length+1})</small><br><b style="font-size:20px">${E(who(t,S.bi[t]))}</b> ${r.num&&r.name?'#'+E(r.num):''} <small>bats ${r.side=='S'?'Slapper':r.side}</small></p>
<label>Pitching for ${E(tn(f))} <small>(${pit?.arm=='L'?'lefty':'righty'})</small><select data-k="cp.${f}" data-n="1">${S.P[f].map((p,i)=>`<option value="${i}" ${i==S.cp[f]?'selected':''}>${E(p.name||'Pitcher '+(i+1))}</option>`).join('')}</select></label>
<button class="b" data-a="dlg" style="width:100%;margin-top:8px;min-height:44px">Substitute batter / pitcher</button>`}
function renderTab(){document.querySelectorAll('.tabs .b').forEach(b=>b.classList.toggle('on',b.dataset.v==tab));
if(tab=='a'){const t=bt(),i=S.bi[t]%S.L[t].length,mine=S.pitches.filter(p=>p.t==t&&p.bi%S.L[t].length==i);const g={};mine.forEach(p=>(g[p.pa]=g[p.pa]||[]).push(p));
$('#tb').innerHTML=`<h3>${E(who(t,S.bi[t]))} vs ${E(pn(ft()+':'+S.cp[ft()]))}</h3>`+(Object.keys(g).length?Object.keys(g).reverse().map(pa=>{const pl=S.plays.find(x=>x.pa==pa);return`<p><b>${pl?'PA '+pa+' – '+(RS[pl.r]||pl.res):'Current at-bat'}</b><br>${g[pa].map(p=>`<span class="chip">${p.n}. ${p.type}${p.velo?' '+p.velo:''} · ${O[p.o]} · ${p.cnt} · ${zl(p.x,p.y)}</span>`).join('')}</p>`}).join(''):'<p><small>No pitches to this batter yet. Chart the first pitch.</small></p>');return}
const keys=['away','home'].flatMap(t=>S.P[t].map((_,i)=>t+':'+i));if(!anK||!keys.includes(anK))anK=ft()+':'+S.cp[ft()];
const l=S.pitches.filter(p=>p.pk==anK),s=stats(l),m=mix(l);
$('#tb').innerHTML=`<select data-a="anp" id="ansel">${keys.map(k=>`<option value="${k}" ${k==anK?'selected':''}>${E(pk(k))}</option>`).join('')}</select>
<div class="grid g4" style="margin:8px 0">${[['Pitches',s.n],['Strike %',s.sp],['First-pitch K %',s.fps],['Avg mph',s.v]].map(([a,b])=>`<div><small>${a}</small><br><b style="font:700 30px 'Barlow Condensed',sans-serif">${b}</b></div>`).join('')}</div>
<b>Pitch usage</b>${m.length?m.map(([t,a])=>{const p=Math.round(a.length/l.length*100);return`<div class="bar"><span>${t}</span><i style="width:${p*1.6}px"></i><span>${p}% <small>${a.length} · ${avg(a)} mph</small></span></div>`}).join(''):'<p><small>No pitches charted for this pitcher.</small></p>'}
<b>By count</b><table><tr><th>Count</th><th>#</th><th>Avg mph</th><th>Mix</th></tr>${CNTS.map(c=>[c,l.filter(p=>p.cnt==c)]).filter(x=>x[1].length).map(([c,a])=>`<tr><td>${c}</td><td>${a.length}</td><td>${avg(a)}</td><td>${mix(a).map(([t,z])=>t+' '+z.length).join(', ')}</td></tr>`).join('')}</table>
<b>Locations</b> <small>(catcher's view · blue ball, red strike, green in play)</small>${zoneSvg(l)}`}
function renderBook(){const g=S.g,keys=[],allK=[...new Set(S.pitches.map(p=>p.pk))];if(bookP!='all'&&!allK.includes(bookP))bookP='all';const PF=S.pitches.filter(p=>bookP=='all'||p.pk==bookP);PF.forEach(p=>{const k=p.inn+'-'+p.half;if(!keys.includes(k))keys.push(k)});
const halves=keys.map(k=>{const[inn,h]=k.split('-'),ps=PF.filter(p=>p.inn==inn&&p.half==h),pas=[...new Set(ps.map(p=>p.pa))],t=h=='top'?'away':'home';
return`<h3>${h=='top'?'Top':'Bottom'} ${inn} — ${E(tn(t))} batting</h3><table><tr><th>Batter</th><th>Pitcher</th><th>#</th><th>Type</th><th>mph</th><th>Zone</th><th>Cnt</th><th>Result</th><th>PA result</th></tr>${pas.map(pa=>{const a=ps.filter(p=>p.pa==pa),pl=S.plays.find(x=>x.pa==pa);return a.map((p,i)=>`<tr>${i?'':`<td rowspan="${a.length}"><b>${E(who(p.t,p.bi))}</b></td><td rowspan="${a.length}">${E(pn(p.pk))}</td>`}<td>${p.n}</td><td>${p.type}</td><td>${p.velo||''}</td><td>${zl(p.x,p.y)}</td><td>${p.cnt}</td><td>${O[p.o]}</td>${i?'':`<td rowspan="${a.length}"><b>${pl?(RS[pl.r]||pl.res)+(pl.ht?' ('+pl.ht+')':''):'—'}</b></td>`}</tr>`).join('')}).join('')}</table>`}).join('');
const pks=allK.filter(k=>bookP=='all'||k==bookP);
const chartBlock=bookP=='all'?'':`<div class="two"><div><b>Pitch location by type</b>${zoneT(PF)}${legend(mix(PF).map(([t])=>[TC[t],t]))}</div><div><b>Pitch location by result</b>${zoneSvg(PF)}${legend([['#3B82F6','Ball / HBP'],['#DC2626','Strike / foul'],['#16A34A','In play']])}</div></div><small>Catcher's view. Only pitches with a plotted location appear.</small>
<table><tr><th>Pitch</th><th>#</th><th>Usage</th><th>Avg mph</th><th>Strike %</th></tr>${mix(PF).map(([t,a])=>`<tr><td>${sw(TC[t])}${t}</td><td>${a.length}</td><td>${pc(a.length,PF.length)}</td><td>${avg(a)}</td><td>${pc(a.filter(p=>STR.includes(p.o)).length,a.length)}</td></tr>`).join('')}</table>`;
$('#book').innerHTML=`<div class="noprint" style="margin-bottom:10px"><button class="b go" data-a="print">Print / Export PDF</button> <select id="bsel" style="width:auto;min-width:230px"><option value="all">All pitchers</option>${allK.map(k=>`<option value="${k}" ${k==bookP?'selected':''}>${E(pk(k))} (${S.pitches.filter(p=>p.pk==k).length})</option>`).join('')}</select> <small>Choose “Save as PDF” in the print dialog.</small></div>
<div class="brand"><img src="logo.png" height="44" alt="" onerror="this.remove()">CAL SOFTBALL · PITCH CHART</div><h2>${E(tn('away'))} at ${E(tn('home'))}</h2><p>${E((g.date||'').replace('T',' '))} · ${E(g.venue)} · Score ${S.score.away}–${S.score.home} · ${g.inn} innings</p>
<h3>Pitcher summary${bookP=='all'?'':' — '+E(pk(bookP))}</h3><table><tr><th>Pitcher</th><th>Pitches</th><th>Strike %</th><th>FPS %</th><th>Avg mph</th><th>Usage</th></tr>${pks.map(k=>{const l=S.pitches.filter(p=>p.pk==k),s=stats(l);return`<tr><td>${E(pk(k))}</td><td>${s.n}</td><td>${s.sp}</td><td>${s.fps}</td><td>${s.v}</td><td>${mix(l).map(([t,a])=>t+' '+pc(a.length,l.length)).join(', ')}</td></tr>`}).join('')||'<tr><td colspan="6">No pitches charted yet.</td></tr>'}</table>
${chartBlock}<div class="two">${['away','home'].map(t=>`<div><b>${E(tn(t))} spray chart</b>${fieldSvg(S.plays.filter(p=>p.t==t&&(bookP=='all'||p.pk==bookP)).map(p=>({...p,r:p.r})))}</div>`).join('')}</div><small>Yellow hit · white out · red error · orange FC</small>
<div class="brk"></div>${halves||'<p>Chart some pitches to build the sheet.</p>'}`}
function render(){$('#setup').hidden=view!='setup';$('#live').hidden=view!='live';$('#book').hidden=view!='book';
[['nl','live'],['nb','book'],['ns','setup']].forEach(([i,v])=>$('#'+i).classList.toggle('on',view==v));$('#undo').hidden=view!='live';
if(view=='setup'){['gh:home','ga:away'].forEach(x=>{const[i,k]=x.split(':');if(document.activeElement.id!=i)$('#'+i).value=S.g[k]});$('#gd').value=S.g.date;$('#gv').value=S.g.venue;$('#gi').value=S.g.inn;if(!$('#srost').contains(document.activeElement))$('#srost').innerHTML=rosters()}
if(view=='live'){renderSB();renderTab();drawVel();qlabel();document.querySelectorAll('#types .b').forEach(b=>b.classList.toggle('on',b.dataset.v==sel.type))}
if(view=='book')renderBook()}
/* spray dialog */
function openSpray(){sp={x:null,y:null,ht:null};$('#msg').textContent='';drawSp();$('#spray').showModal()}
function drawSp(){$('#field').innerHTML=FIELD+(sp.x!=null?`<circle cx="${sp.x}" cy="${sp.y}" r="10" fill="#FACC15" stroke="#000" stroke-width="2"/>`:'');
$('#hts').innerHTML=HT.map(h=>`<button class="b ${sp.ht==h?'on':''}" data-a="ht" data-v="${h}">${h}</button>`).join('');
$('#rss').innerHTML=Object.entries(RS).map(([k,l])=>`<button class="b" data-a="res" data-v="${k}">${l}</button>`).join('')}
/* actions */
const setPath=(k,v)=>{const p=k.split('.');let o=S;p.slice(0,-1).forEach(x=>o=o[x]);o[p[p.length-1]]=v};
const ACT={
undo(){if(H.length){S=JSON.parse(H.pop());done()}},
view(v){view=v;done()},tab(v){tab=v;render()},theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()=='#06162B';r.dataset.theme=d?'light':'dark';ls.set('sbt',r.dataset.theme)},
type(v){sel.type=v;sel.alt=false;if(!velRange().includes(+sel.velo))sel.velo='';render()},vel(v){sel.velo=sel.velo==v?'':+v;drawVel()},valt(){sel.alt=!sel.alt;sel.velo='';drawVel()},out(v){snap();v=+v;S.outs=S.outs==v+1?v:v+1;chk();done()},
base(v){snap();S.bases[v]^=1;done()},sc(v){snap();const t=v.slice(0,-1);S.score[t]=Math.max(0,S.score[t]+(v.slice(-1)=='+'?1:-1));done()},
add(v){const[a,t]=v.split('.');snap();S[a][t].push(a=='L'?{name:'',num:'',side:'R'}:{name:'',arm:'R'});$('#srost').innerHTML=rosters();$('#rrost').innerHTML=rosters();done()},
dlg(v){const d=$('#rd');if(v=='x'){d.close();return}$('#rrost').innerHTML=rosters();d.showModal()},
start(){view='live';H=[];done()},print(){window.print()},
new(){const b=$('#newb');if(!newT){newT=setTimeout(()=>{newT=0;b.textContent='New game'},3000);b.textContent='Tap again to erase';return}clearTimeout(newT);newT=0;b.textContent='New game';S=blank();H=[];anK=null;view='setup';$('#srost').innerHTML='';done()},
ht(v){sp.ht=v;drawSp()},
res(v){if(sp.x==null||!sp.ht){$('#msg').textContent='Tap the field and pick a hit type first.';return}const p=pend;pend=null;$('#spray').close();endPA('IP',APPLY[v],{r:v,ht:sp.ht,x:sp.x,y:sp.y})},
cancelsp(){$('#spray').close()},
dd(v){const d=$('#dd');if(v=='x'){d.close();return}const c=cfg();$('#cu').value=c.url||'';$('#ct').value=c.token||'';$('#cm').value=c.mode||'pitch';$('#sst').textContent='';d.showModal()},
xjson(){dl(fname()+'.json',JSON.stringify({v:1,S},null,1),'application/json')},
xcsv(){dl(fname()+'-pitches.csv',csv([HDR,...pitchRows()]),'text/csv')},
imp(){$('#imf').click()},sendnow(){sync(1)},
quick(){sel.quick=!sel.quick;ls.set('sbq',sel.quick?'1':'');qlabel()},qx(){sel.x=sel.y=null;drawDot()},oa(v){snap();S.outs=Math.max(0,S.outs+(+v));chk();done()},anp(){}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&ACT[a.dataset.a]&&a.tagName!='SELECT')ACT[a.dataset.a](a.dataset.v);const o=e.target.closest('[data-o]');if(o)pitch(o.dataset.o)});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='ansel'){anK=t.value;renderTab();return}if(t.id=='bsel'){bookP=t.value;renderBook();return}if(t.dataset.c){const x=cfg();x[t.dataset.c]=t.value.trim();ls.set('sbcfg',JSON.stringify(x));return}const k=t.dataset.k;if(!k)return;snapMaybe(k);setPath(k,t.dataset.n?+t.value:t.value);if(k.startsWith('cp.'))anK=null;save();if(view=='live')renderSB();if(view=='live'&&k.startsWith('cp.'))renderTab()});
const snapMaybe=k=>{if(k.startsWith('cp.'))snap()};
$('#spray').addEventListener('close',()=>{if(pend){pend=null;ACT.undo()}});
$('#field').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();sp.x=Math.round((e.clientX-r.left)/r.width*400);sp.y=Math.round((e.clientY-r.top)/r.height*400);drawSp()});
$('#zone').innerHTML=zGrid();
$('#zone').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();sel.x=Math.round((e.clientX-r.left)/r.width*300);sel.y=Math.round((e.clientY-r.top)/r.height*330);drawDot();if(sel.quick)showQP(e.clientX-r.left,e.clientY-r.top,r)});
function showQP(px,py,r){const q=$('#qp');q.innerHTML=Object.entries(O).map(([k,l])=>`<button class="b ${k=='inplay'?'go':''}" data-o="${k}">${l}</button>`).join('')+'<button class="b" data-a="qx" style="grid-column:1/-1;min-height:40px">Cancel location</button>';q.hidden=false;const w=q.offsetWidth,h=q.offsetHeight;q.style.left=Math.max(0,Math.min(r.width-w,px-w/2))+'px';let t=py+22;if(t+h>r.height)t=py-h-22;q.style.top=Math.max(0,t)+'px'}
$('#types').innerHTML=T.map(t=>`<button class="b" data-a="type" data-v="${t}">${t}</button>`).join('');
$('#outs').innerHTML=Object.entries(O).map(([k,l])=>`<button class="b ${k=='inplay'?'go':''}" data-o="${k}">${l}</button>`).join('');
/* velocity buttons: 55-68 normally, 43-56 for Changeup/Offspeed */
const velRange=()=>{const slow=sel.type=='Changeup'||sel.type=='Offspeed',lo=slow!=!!sel.alt?43:55;return Array.from({length:14},(_,i)=>lo+i)};
function drawVel(){const r=velRange();$('#vel').innerHTML=r.map(v=>`<button class="b ${sel.velo==v?'on':''}" data-a="vel" data-v="${v}">${v}</button>`).join('')+`<button class="b" data-a="valt" style="grid-column:1/-1;min-height:44px;font-size:15px">${r[0]==43?'Show 55–68 mph':'Show 43–56 mph'}</button>`}
const qlabel=()=>{const b=$('#qb');b.textContent='Quick mode: '+(sel.quick?'ON':'off');b.classList.toggle('on',!!sel.quick)};
/* data export + Google Sheets sync */
const HDR=['GameID','Date','Venue','Home','Away','Inning','Half','PA','Pitch#','Batting Team','Batter','Batter #','Bats','Pitcher Team','Pitcher','Throws','Pitch Type','Velo','Zone X','Zone Y','Zone','Count','Pitch Result','PA Result','Hit Type','Spray X','Spray Y'];
const GH=['GameID','Date','Venue','Home','Away','Home Score','Away Score','Innings','Pitches','Updated'];
const pitchRows=()=>S.pitches.map(p=>{const r=bp(p.t,p.bi),[pt,pi]=p.pk.split(':'),P=S.P[pt][pi]||{},pl=S.plays.find(x=>x.pa==p.pa),last=!!pl&&S.pitches.filter(q=>q.pa==p.pa).pop()===p;
return[S.id,(S.g.date||'').replace('T',' '),S.g.venue,S.g.home,S.g.away,p.inn,p.half=='top'?'Top':'Bottom',p.pa,p.n,tn(p.t),who(p.t,p.bi),r.num,r.side=='S'?'Slapper':r.side,tn(pt),pn(p.pk),P.arm||'',p.type,p.velo===''?'':+p.velo,p.x??'',p.y??'',zl(p.x,p.y).replace('—',''),p.cnt,O[p.o],last?(RS[pl.r]||pl.res):'',last?(pl.ht||''):'',last&&pl.x!=null?pl.x:'',last&&pl.y!=null?pl.y:'']});
const csv=a=>a.map(r=>r.map(v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n');
const fname=()=>(S.g.away+'-at-'+S.g.home+'-'+(S.g.date||'').slice(0,10)).replace(/[^\w-]+/g,'_');
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
const cfg=()=>{try{return JSON.parse(ls.get('sbcfg')||'{}')}catch(e){return{}}};
function badge(t,bad,hdr){$('#sbadge').textContent=hdr?'⚠ Sheet offline':'';$('#sbadge').style.color='#FF7070';$('#sst').textContent=t;$('#sst').style.color=bad?'var(--bad)':''}
let sT=0,pend2=false;
async function sync(manual){const c=cfg();if(!c.url){if(manual)badge('Paste your Apps Script URL first.',1);return}
badge('Sending…');
try{await fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:c.token||'',gameId:S.id,header:HDR,rows:pitchRows(),gh:GH,game:[S.id,(S.g.date||'').replace('T',' '),S.g.venue,S.g.home,S.g.away,S.score.home,S.score.away,S.g.inn,S.pitches.length,new Date().toLocaleString()]})});pend2=false;badge('Sent '+new Date().toLocaleTimeString()+' (check your Sheet)')}
catch(e){pend2=true;badge('Sheet offline – will retry',1,1)}}
function auto(){const c=cfg(),m=c.mode||'pitch';if(!c.url)return;if(m=='pitch'||(m=='half'&&flip)){flip=0;clearTimeout(sT);sT=setTimeout(()=>sync(),1500)}}
addEventListener('online',()=>pend2&&sync());
$('#imf').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),n=d.S||d;if(!n.g||!n.L||!n.P||!n.pitches||!n.plays)throw 0;S=n;S.id=S.id||newId();H=[];anK=null;view='live';done();badge('Imported '+f.name)}catch(x){badge('That file is not a valid game export.',1)}};r.readAsText(f);e.target.value=''});
{const t=ls.get('sbt');if(t)document.documentElement.dataset.theme=t}
render();
</script></body></html>
