<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cal Softball Data</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.jpg">
<style>
:root{--bg:#F3F5F8;--p:#fff;--ink:#003262;--tx:#1B2533;--mut:#5B6778;--ln:#DDE2E9;--acc:#FDB515;--bad:#C42B2B;--grass:#4F9A60;--dirt:#C9A27A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 16px;background:#003262;color:#fff;border-bottom:3px solid var(--acc)}
header img{height:46px;width:46px;border-radius:8px}header b{font-size:18px;flex:1}.hnav{display:flex;flex-wrap:wrap;gap:2px}.hnav a{color:#fff;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px;font-size:14px}.hnav a:hover{background:rgba(255,255,255,.14)}.hnav a.on{box-shadow:inset 0 -3px 0 #FDB515}@media print{.hnav{display:none}}header a{color:#fff;font-weight:600;text-decoration:none;padding:8px 10px;border-radius:6px}header a:hover{background:rgba(255,255,255,.14)}header button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer}header button:hover{background:rgba(255,255,255,.14)}
button,select,input{font:inherit;color:inherit;min-height:40px;border:1px solid var(--ln);border-radius:8px;background:var(--p);padding:0 12px}
button{cursor:pointer;font-weight:600}button.go{background:var(--acc);color:#003262;border-color:var(--acc)}button.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}
main{max-width:1400px;margin:auto;padding:14px}
.card{background:var(--p);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink)}.card h3:before{content:"";display:inline-block;width:4px;height:12px;background:var(--acc);border-radius:2px;margin-right:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:6px}label{font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px;margin:0}.seg button:last-child{border-radius:0 8px 8px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{min-height:44px;padding:0 22px;font-size:15px}
.chips button{min-height:32px;font-size:12.5px;padding:0 10px;margin:2px}.chips button.off{opacity:.4}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{border:1px solid var(--ln);padding:5px 7px;text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{background:#003262;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none}th.s:after{content:" ▼";font-size:9px}th.s.asc:after{content:" ▲"}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover td{background:#FFF9E6}tr.sel td{background:#FFF1BF!important}tr.t td{font-weight:700;background:#FFF6DC;border-top:2px solid #003262}
.wrap{overflow-x:auto}.mut,small{color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}.kp div{border:1px solid var(--ln);border-radius:8px;padding:8px 10px}.kp b{display:block;font-size:22px;color:var(--ink);line-height:1.15}.kp small{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}

.zd{cursor:pointer}.zd:hover{stroke:#FDB515;stroke-width:3}

#st{font-weight:600}#st.bad{color:var(--bad)}.bad{color:var(--bad)}
#gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px;max-height:240px;overflow:auto;margin-top:8px;border:1px solid var(--ln);border-radius:8px;padding:8px}#gl label{flex-direction:row;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--tx)}#gl input{min-height:0;width:18px;height:18px}
summary{cursor:pointer;font-weight:600;color:var(--ink)}
[hidden]{display:none!important}
@media print{header,.tabs,#gate,#rf,button,details,.card .row,#typseg{display:none!important}body{background:#fff}main{padding:0}.card{box-shadow:none;break-inside:avoid}@page{margin:12mm}}</style></head><body>
<header><a href="index.html"><img src="logo.jpg" alt="Cal Softball"></a><b>Team Data</b><nav class="hnav"><a href="index.html">Home</a><a href="chart.html">Chart a game</a><a href="stats.html" class="on">Data</a><a href="rapsodo.html">Rapsodo</a><a href="lab.html">Lab</a></nav><button id="pr">Print / PDF</button><button id="rf">Refresh</button></header>
<main>
<div id="gate" class="card" hidden><h3>Team passcode</h3><p>Enter the passcode that was set as <b>TEAM_PASSCODE</b> in Vercel.</p><div class="row"><label>Passcode<input id="pw" type="password" autocomplete="off"></label><button class="go" id="pwb">Connect</button></div><p id="gmsg" class="bad"></p></div>
<div id="app" hidden>
<div class="card"><div class="row">
<div><small>Show</small><div class="seg" id="typseg"><button data-a="typ" data-v="game">Games</button><button data-a="typ" data-v="scrimmage">Scrimmages</button><button data-a="typ" data-v="all">All</button></div></div>
<label>From<input type="date" id="df"></label><label>To<input type="date" id="dt"></label><label>Team<select id="tm"></select></label><span id="st" class="mut"></span></div>
<details><summary id="gsum">Choose games</summary><div style="margin-top:8px"><button data-a="gall">All</button> <button data-a="gnone">None</button> <button data-a="glast">Last 5</button></div><div id="gl"></div></details></div>
<div class="tabs"><button data-a="tab" data-v="p">Pitchers</button><button data-a="tab" data-v="b">Batters</button><button data-a="tab" data-v="d">Data</button></div>
<div id="view"></div>
</div></main>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cfg={};try{cfg=JSON.parse(ls.get('sbcfg')||'{}')}catch(e){}
let PASS=cfg.dbpass||'';
const cal=t=>/\b(cal|california|berkeley)\b/i.test(t||'');
const TY=['Rise','Drop','Curve','Screw','Changeup','Offspeed','Fastball','Unknown'];
const TC={Rise:'#2563EB',Drop:'#DC2626',Curve:'#16A34A',Screw:'#9333EA',Changeup:'#F59E0B',Offspeed:'#0891B2',Fastball:'#111827',Unknown:'#6B7280'};
const SWG=['Swinging Strike','Foul','In Play'],STRK=['Called Strike','Swinging Strike','Foul','In Play'];
const HB={Single:1,Double:2,Triple:3,'Home Run':4};
const CNTS=['0-0','0-1','0-2','1-0','1-1','1-2','2-0','2-1','2-2','3-0','3-1','3-2'];
const CNT={first:c=>c=='0-0',ahead:c=>['0-1','0-2','1-2'].includes(c),behind:c=>['1-0','2-0','3-0','2-1','3-1'].includes(c),even:c=>['1-1','2-2','3-2'].includes(c),two:c=>/-2$/.test(c)};
let GAMES=[],RAW=[],ROWS=[],up={};
const st={tab:'p',typ:'game',from:'',to:'',team:'*cal*',selG:new Set(),f:{side:'all',arm:'all',types:new Set(),cnt:'all'},cols:{p:new Set(['Volume','Results','Command','Swing/miss','Velocity']),b:new Set(['Volume','Counting','Rates','Approach'])},sort:{p:['n',0],b:['PA',0]},player:null,zmode:'type',zoff:new Set()};
const fmtDate=v=>{v=String(v||'');const m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(v);if(m)return m[3]+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');if(/^\d{4}-\d\d-\d\dT.*Z$/.test(v)){const d=new Date(v);if(!isNaN(d))return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}return v.slice(0,10)};
/* ---------- server ---------- */
async function api(q,opt={}){let r;try{r=await fetch('/api/games'+(q||''),{...opt,headers:{'Content-Type':'application/json','x-passcode':PASS}})}catch(e){throw new Error('Could not reach the server. Open this page from your Vercel site.')}
const t=await r.text();let j=null;try{j=JSON.parse(t)}catch(e){}
if(!j)throw Object.assign(new Error(r.status==404?'The database is not set up on this site yet: the /api/games function was not found. Upload the api folder and redeploy.':'Unexpected response from the server (HTTP '+r.status+').'),{status:r.status});
if(!r.ok)throw Object.assign(new Error(j.error||'HTTP '+r.status),{status:r.status});return j}
function norm(g){const h=g.header,m=g.meta,ix={};h.forEach((k,i)=>ix[k]=i);const v=(r,k)=>ix[k]==null?'':r[ix[k]],n=(r,k)=>{const x=v(r,k);return x===''||x==null?null:+x};
return g.rows.map(r=>({game:m.id,date:fmtDate(m.date||v(r,'Date')),gt:m.type||'game',pa:+v(r,'PA'),n:+v(r,'Pitch#'),bat:v(r,'Batter'),bt:v(r,'Batting Team'),side:/^(S|Slapper)$/.test(v(r,'Bats'))?'L':v(r,'Bats'),pit:v(r,'Pitcher'),pt:v(r,'Pitcher Team'),arm:v(r,'Throws'),ty:v(r,'Pitch Type'),v:n(r,'Velo'),x:n(r,'Zone X'),y:n(r,'Zone Y'),cnt:String(v(r,'Count')),res:v(r,'Pitch Result'),par:v(r,'PA Result')||'',sx:n(r,'Spray X'),sy:n(r,'Spray Y'),f3:v(r,'F3P')||'',rd:String(v(r,'Run Detail')||'').split(';').filter(Boolean).map(s=>{const a=s.split('|');return{e:a[0],pn:a[1]||'',rbi:a[2]&&a[2]!='-'?a[2]:''}})})).filter(p=>p.pit&&p.bat)}
const setSt=(t,bad)=>{$('#st').textContent=t;$('#st').className=bad?'bad':'mut'};
async function loadAll(){setSt('Loading…');const l=await api('');GAMES=l.games||[];RAW=[];ROWS=[];
for(let off=0;off<GAMES.length;off+=20){const j=await api('?all=1&offset='+off+'&limit=20');(j.games||[]).forEach(g=>{RAW.push(g);ROWS.push(...norm(g))})}
const teams=teamList();if(!teams.some(cal)&&st.team=='*cal*')st.team=teams[0]||'*cal*';
fillTeams();refreshGames();setSt(GAMES.length+' games, '+ROWS.length+' pitches loaded')}
/* ---------- filters ---------- */
const teamList=()=>[...new Set(ROWS.flatMap(p=>[p.pt,p.bt]))].filter(Boolean).sort((a,b)=>cal(b)-cal(a)||a.localeCompare(b));
const teamMatch=t=>st.team=='*cal*'?cal(t):st.team=='*opp*'?!cal(t):t==st.team;
function fillTeams(){const t=teamList();$('#tm').innerHTML=(t.some(cal)?'<option value="*cal*">All Cal teams</option>':'')+(t.some(x=>!cal(x))?'<option value="*opp*">All opponents</option>':'')+t.map(x=>`<option value="${E(x)}">${E(x)}</option>`).join('');$('#tm').value=st.team}
const avail=()=>GAMES.filter(g=>(st.typ=='all'||(g.type||'game')==st.typ)&&(!st.from||fmtDate(g.date)>=st.from)&&(!st.to||fmtDate(g.date)<=st.to)&&(teamMatch(g.home)||teamMatch(g.away)));
function refreshGames(){st.selG=new Set(avail().map(g=>g.id));st.player=null;updFbar();renderView()}
function updFbar(){document.querySelectorAll('#typseg button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.typ));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v==st.tab));
const a=avail();$('#gsum').textContent=`Games included: ${a.filter(g=>st.selG.has(g.id)).length} of ${a.length}`;
$('#gl').innerHTML=a.map(g=>`<label><input type="checkbox" data-g="${E(g.id)}" ${st.selG.has(g.id)?'checked':''}>${E(fmtDate(g.date))} · ${E(g.away)} at ${E(g.home)}${g.type=='scrimmage'?' <span class="pv">SCRIM</span>':''}</label>`).join('')||'<span class="mut">No games match these filters.</span>'}
const filtered=()=>st.f.side!='all'||st.f.arm!='all'||st.f.types.size>0||st.f.cnt!='all';
const pf=p=>(st.f.side=='all'||p.side==st.f.side)&&(st.f.arm=='all'||p.arm==st.f.arm)&&(!st.f.types.size||st.f.types.has(p.ty))&&(st.f.cnt=='all'||CNT[st.f.cnt](p.cnt));
const scope=kind=>ROWS.filter(p=>st.selG.has(p.game)&&teamMatch(kind=='p'?p.pt:p.bt)&&pf(p));
/* ---------- stats ---------- */
const ratio=(a,b)=>b?a/b:null,sum=a=>a.reduce((x,y)=>x+y,0);
function core(L){const pa=L.filter(p=>p.par),c=k=>pa.filter(p=>p.par==k).length,h1=c('Single'),h2=c('Double'),h3=c('Triple'),hr=c('Home Run'),bb=c('BB'),hb=c('HBP'),k=c('K'),PA=pa.length,AB=PA-bb-hb,H=h1+h2+h3+hr,TB=h1+2*h2+3*h3+4*hr,o=ratio(H+bb+hb,PA),s=ratio(TB,AB);
return{PA,AB,H,h1,h2,h3,hr,TB,bb,hb,k,ba:ratio(H,AB),obp:o,slg:s,ops:o!=null&&s!=null?o+s:null,kp:ratio(k,PA),bp:ratio(bb,PA)}}
function agg(L){const c=core(L),sw=L.filter(p=>SWG.includes(p.res)).length,wh=L.filter(p=>p.res=='Swinging Strike').length,f=L.filter(p=>p.n==1),fr=L.filter(p=>p.f3),g=new Set(L.map(p=>p.game)).size,v=L.map(p=>p.v).filter(Boolean);
return{...c,n:L.length,g,ppg:g?L.length/g:null,sp:ratio(L.filter(p=>STRK.includes(p.res)).length,L.length),fps:ratio(f.filter(p=>STRK.includes(p.res)).length,f.length),f3:ratio(fr.filter(p=>p.f3=='Win').length,fr.length),swp:ratio(sw,L.length),whp:ratio(wh,sw),ssp:ratio(wh,L.length),av:v.length?sum(v)/v.length:null,mx:v.length?Math.max(...v):null,ppa:ratio(L.length,c.PA)}}
const fi=v=>v==null?'—':v,f1=v=>v==null?'—':v.toFixed(1),f0=v=>v==null?'—':Math.round(v),fp=v=>v==null?'—':Math.round(v*100)+'%',f3=v=>v==null?'—':v.toFixed(3).replace(/^0(?=\.)/,'');
const PCOLS=[['g','G','Volume',fi],['n','Pitches','Volume',fi],['ppg','P/G','Volume',f0],['PA','BF','Volume',fi],['R','R','Results',fi],['ER','ER','Results',fi],['H','H','Results',fi],['bb','BB','Results',fi],['k','K','Results',fi],['ba','BAA','Results',f3],['obp','OBP','Results',f3],['slg','SLG','Results',f3],['kp','K %','Results',fp],['bp','BB %','Results',fp],['sp','Strike %','Command',fp],['fps','FPS %','Command',fp],['f3','F3P %','Command',fp],['swp','Swing %','Swing/miss',fp],['whp','Whiff %','Swing/miss',fp],['ssp','SwStr %','Swing/miss',fp],['av','Avg mph','Velocity',f1],['mx','Max mph','Velocity',fi]];
const BCOLS=[['g','G','Volume',fi],['PA','PA','Volume',fi],['AB','AB','Volume',fi],['H','H','Counting',fi],['h1','1B','Counting',fi],['h2','2B','Counting',fi],['h3','3B','Counting',fi],['hr','HR','Counting',fi],['TB','TB','Counting',fi],['RBI','RBI','Counting',fi],['bb','BB','Counting',fi],['hb','HBP','Counting',fi],['k','K','Counting',fi],['ba','BA','Rates',f3],['obp','OBP','Rates',f3],['slg','SLG','Rates',f3],['ops','OPS','Rates',f3],['kp','K %','Rates',fp],['bp','BB %','Rates',fp],['n','Pitches','Approach',fi],['ppa','P/PA','Approach',f1],['swp','Swing %','Approach',fp],['whp','Whiff %','Approach',fp]];
function chargeMaps(){const ch={},rb={},cg={},rg={};ROWS.forEach(p=>{if(!st.selG.has(p.game)||!p.rd.length)return;p.rd.forEach(r=>{if(teamMatch(p.pt)){const c=ch[r.pn]=ch[r.pn]||{R:0,ER:0};c.R++;if(r.e=='E')c.ER++;const g=cg[p.game+'|'+r.pn]=cg[p.game+'|'+r.pn]||{R:0,ER:0};g.R++;if(r.e=='E')g.ER++}if(teamMatch(p.bt)&&r.rbi){rb[r.rbi]=(rb[r.rbi]||0)+1;rg[p.game+'|'+r.rbi]=(rg[p.game+'|'+r.rbi]||0)+1}})});return{ch,rb,cg,rg}}
function withRuns(a,kind,nm,M){if(filtered()){a.R=a.ER=a.RBI=null;return a}if(kind=='p'){const c=M.ch[nm]||{R:0,ER:0};a.R=c.R;a.ER=c.ER}else a.RBI=M.rb[nm]||0;return a}
function sortRows(arr,kind){const[k,asc]=st.sort[kind];return arr.sort((x,y)=>{const a=k=='name'?x.name:x.a[k],b=k=='name'?y.name:y.a[k];if(a==null&&b==null)return 0;if(a==null)return 1;if(b==null)return -1;const c=a<b?-1:a>b?1:0;return(asc?c:-c)||(y.a.n-x.a.n)})}
let lastTable=[];
function renderTable(){const kind=st.tab,cols=(kind=='p'?PCOLS:BCOLS).filter(c=>st.cols[kind].has(c[2])),R=scope(kind),key=p=>kind=='p'?p.pit:p.bat,q=($('#q')?$('#q').value:'').toLowerCase().trim(),M=chargeMaps();
if(!R.length){$('#tbl').innerHTML='<p class="mut" style="padding:10px">No data for these filters. Pick games above, or load past games on the Data tab.</p>';lastTable=[];return}
const names=[...new Set(R.map(key))];let rows=names.map(nm=>({name:nm,a:withRuns(agg(R.filter(p=>key(p)==nm)),kind,nm,M)}));rows=sortRows(rows,kind).filter(r=>!q||r.name.toLowerCase().includes(q));
const T=agg(R);if(!filtered()){if(kind=='p'){T.R=sum(Object.values(M.ch).map(x=>x.R));T.ER=sum(Object.values(M.ch).map(x=>x.ER))}else T.RBI=sum(Object.values(M.rb))}else T.R=T.ER=T.RBI=null;
const th=(k,l)=>`<th data-a="sort" data-v="${k}" class="${st.sort[kind][0]==k?'s'+(st.sort[kind][1]?' asc':''):''}">${l}</th>`;
$('#tbl').innerHTML=`<table><thead><tr>${th('name',kind=='p'?'Pitcher':'Batter')}${cols.map(c=>th(c[0],c[1])).join('')}</tr></thead><tbody>${rows.map(r=>`<tr data-a="player" data-v="${E(r.name)}" class="${st.player==r.name?'sel':''}"><td>${E(r.name)}</td>${cols.map(c=>`<td>${c[3](r.a[c[0]])}</td>`).join('')}</tr>`).join('')}<tr class="t"><td>Team total</td>${cols.map(c=>`<td>${c[3](T[c[0]])}</td>`).join('')}</tr></tbody></table>`;
lastTable=[[kind=='p'?'Pitcher':'Batter',...cols.map(c=>c[1])],...rows.map(r=>[r.name,...cols.map(c=>c[3](r.a[c[0]]))]),['Team total',...cols.map(c=>c[3](T[c[0]]))]];
$('#tnote').textContent=filtered()?'Pitch filters are on: runs, ER and RBI are hidden, and results (hits, walks, strikeouts) are credited to the pitch that ended each plate appearance.':'Click a player to open their detail. Click a column heading to sort. Runs, ER and RBI come from the run prompts in the charting app.'}
/* ---------- charts ---------- */
const RY=[0,60,130,200,270],RH=[60,70,70,70,60],zrow=y=>y<60?0:y>=270?4:1+Math.floor((y-60)/70);
const zg=()=>Array.from({length:25},(_,k)=>{const c=k%5,r=k/5|0,i=r>0&&r<4&&c>0&&c<4;return`<rect x="${c*60}" y="${RY[r]}" width="60" height="${RH[r]}" class="${i?'zin':'zout'}"/>`}).join('')+'<rect x="60" y="60" width="180" height="210" fill="none" stroke="#003262" stroke-width="3"/>';
const RC=r=>['Ball','Pitchout','Illegal Pitch','HBP'].includes(r)?'#3B82F6':r=='In Play'?'#16A34A':'#DC2626';
function zone(L,inv){const mode=st.zmode,pts=L.filter(p=>p.x!=null&&p.y!=null&&!st.zoff.has(p.ty)),X=p=>inv?300-p.x:p.x;
if(mode=='grid'){const cells={};pts.forEach(p=>{const r=zrow(p.y);let c=Math.min(4,Math.floor(p.x/60));if(inv)c=4-c;const k=r+'-'+c,o=cells[k]=cells[k]||{n:0,sw:0,wh:0};o.n++;if(SWG.includes(p.res))o.sw++;if(p.res=='Swinging Strike')o.wh++});const mx=Math.max(1,...Object.values(cells).map(c=>c.n));
return`<svg viewBox="0 0 300 330">${zg()}${Object.entries(cells).map(([k,o])=>{const[r,c]=k.split('-').map(Number);return`<rect x="${c*60}" y="${RY[r]}" width="60" height="${RH[r]}" fill="#FDB515" fill-opacity="${(.15+.75*o.n/mx).toFixed(2)}"/><text x="${c*60+30}" y="${RY[r]+RH[r]/2}" font-size="17" font-weight="700" text-anchor="middle" fill="#003262">${o.n}</text><text x="${c*60+30}" y="${RY[r]+RH[r]/2+15}" font-size="11" text-anchor="middle" fill="#003262">${o.sw?Math.round(o.wh/o.sw*100)+'% whiff':''}</text>`}).join('')}</svg><small>Number = pitches in that cell. % = swinging strikes ÷ swings.</small>`}

/* heat maps: smoothed rate by location (30-unit cells, neighbours share weight) */
function heat(L,inv,num,den,ttl,sub){const pts=L.filter(p=>p.x!=null&&p.y!=null&&!st.zoff.has(p.ty)&&den(p)),C=10,R=11,N=Array.from({length:C},()=>Array(R).fill(0)),D=Array.from({length:C},()=>Array(R).fill(0)),K=Array.from({length:C},()=>Array(R).fill(0));
let tn=0,td=0;pts.forEach(p=>{const x=inv?300-p.x:p.x,c=Math.max(0,Math.min(C-1,Math.floor(x/30))),r=Math.max(0,Math.min(R-1,Math.floor(p.y/30))),y=num(p)?1:0;td++;tn+=y;K[c][r]++;
for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){const cc=c+dc,rr=r+dr;if(cc<0||rr<0||cc>=C||rr>=R)continue;const w=(dc?.5:1)*(dr?.5:1);D[cc][rr]+=w;N[cc][rr]+=w*y}});
const cells=[];let mx=.01;for(let c=0;c<C;c++)for(let r=0;r<R;r++)if(D[c][r]>=2){const v=N[c][r]/D[c][r];cells.push([c,r,v]);mx=Math.max(mx,v)}
const sq=cells.map(([c,r,v])=>`<rect x="${c*30}" y="${r*30}" width="30" height="30" fill="#003262" fill-opacity="${(.06+.86*v/mx).toFixed(2)}"/>${K[c][r]>=2?`<text x="${c*30+15}" y="${r*30+19}" font-size="10" font-weight="700" text-anchor="middle" fill="${v/mx>.5?'#fff':'#003262'}">${Math.round(v*100)}</text>`:''}`).join('');
return`<div><b>${ttl}</b><br><small>${sub}${td?' · overall '+Math.round(tn/td*100)+'% ('+tn+'/'+td+')':''}</small><svg viewBox="0 0 300 330" style="background:#fff;border:1px solid var(--ln)">${sq}<rect x="60" y="60" width="180" height="210" fill="none" stroke="#FDB515" stroke-width="3"/></svg>${td<15?'<small class="mut">Small sample, read with caution.</small>':''}</div>`}
function heats(L,pit){const sw=p=>SWG.includes(p.res),wh=p=>p.res=='Swinging Strike',bip=p=>p.res=='In Play',hit=p=>!!HB[p.par],tk=p=>p.res=='Called Strike'||p.res=='Ball',cs=p=>p.res=='Called Strike',ball=p=>p.res=='Ball',all=()=>true;
const maps=pit?[heat(L,1,wh,sw,'Where they get swings and misses','whiff % of swings'),heat(L,1,hit,bip,'Where they get hit','hit % of balls in play'),heat(L,1,ball,all,'Where they miss the zone','ball % of pitches')]:[heat(L,0,wh,sw,'Where they whiff','whiff % of swings'),heat(L,0,cs,tk,'Where they take strikes','called strike % of takes'),heat(L,0,hit,bip,'Where they get hits','hit % of balls in play')];
return`<div class="card"><h3>Heat maps <span class="pv">${pit?'PITCHER VIEW':"CATCHER'S VIEW"}</span></h3><div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${maps.join('')}</div><small>Darker = higher rate. Numbers are the rate (%) in that 30-unit square and appear when at least 2 pitches landed there; neighbouring squares share some weight to smooth small samples. The gold box marks the zone you drew on the chart. Pitch-type and filter selections above apply.</small></div>`}

if(t.id=='df'){st.from=t.value;refreshGames()}else if(t.id=='dt'){st.to=t.value;refreshGames()}
else if(t.id=='tm'){st.team=t.value;refreshGames()}
else if(t.dataset.g){t.checked?st.selG.add(t.dataset.g):st.selG.delete(t.dataset.g);st.player=null;updFbar();renderView()}
else if(t.dataset.f){st.f[t.dataset.f]=t.value;renderTable();detail()}
else if(t.dataset.gt){try{await api('',{method:'PATCH',body:JSON.stringify({id:t.dataset.gt,type:t.value})});const g=GAMES.find(x=>x.id==t.dataset.gt);g.type=t.value;RAW.forEach(r=>{if(r.meta.id==g.id)r.meta.type=t.value});ROWS.forEach(p=>{if(p.game==g.id)p.gt=t.value});setSt('Saved')}catch(x){setSt(x.message,1)}}
else if(t.id=='utype'){buildUpload();upUI()}
else if(t.id=='fp'||t.id=='fg'){const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{up[t.id=='fp'?'pitches':'games']=parseCSV(String(rd.result));buildUpload();upUI()};rd.readAsText(f)}});
document.addEventListener('input',e=>{if(e.target.id=='q'){renderTable()}});
function upUI(){const m=$('#upm'),b=$('#upb');if(!m)return;m.className='mut';if(up.msg){m.textContent=up.msg;m.className='bad';b.disabled=true;return}if(!up.list||!up.list.length){m.textContent='Choose the Pitches file to begin.';b.disabled=true;return}
const ex=up.list.filter(g=>GAMES.some(x=>x.id==g.id)).length,pc=sum(up.list.map(g=>g.rows.length));m.textContent=`Found ${up.list.length} game${up.list.length>1?'s':''} (${pc} pitches), dated ${up.list.map(g=>g.meta.date).sort()[0]} to ${up.list.map(g=>g.meta.date).sort().pop()}.${ex?' '+ex+' already in the database and will be replaced.':''}`;b.disabled=false}
$('#pr').onclick=()=>window.print();
$('#rf').onclick=async()=>{try{await loadAll();renderView()}catch(e){setSt(e.message,1)}};
function applyQuery(){const q=new URLSearchParams(location.search),g=q.get('game');
if(q.get('typ'))st.typ=q.get('typ');if(q.get('team'))st.team=q.get('team');if(['p','b','d'].includes(q.get('tab')))st.tab=q.get('tab');
if(g){st.typ='all';st.team=teamList().some(cal)?'*cal*':(teamList()[0]||'*cal*')}
fillTeams();refreshGames();
if(g&&GAMES.some(x=>x.id==g)){st.selG=new Set([g]);updFbar();renderView()}
if(q.get('player')){st.player=q.get('player');renderView()}}
async function connect(){try{await loadAll();$('#gate').hidden=true;$('#app').hidden=false;if(!window._q){window._q=1;applyQuery()}renderView()}catch(e){$('#app').hidden=true;$('#gate').hidden=false;$('#gmsg').textContent=e.status==401?(PASS?'That passcode is not right.':''):e.message}}
$('#pwb').onclick=()=>{PASS=$('#pw').value.trim();let o={};try{o=JSON.parse(ls.get('sbcfg')||'{}')}catch(x){}o.dbpass=PASS;ls.set('sbcfg',JSON.stringify(o));connect()};
$('#pw').addEventListener('keydown',e=>{if(e.key=='Enter')$('#pwb').click()});
$('#app').hidden=true;if(PASS)connect();else{$('#gate').hidden=false}
</script></body></html>
